:root{

:root[data-theme="dark"]{

  --ok:#62cb93; --ok-bg:#143326; --warn:#efb457; --warn-bg:#3a2b10; --bad:#ff8b7c; --bad-bg:#401a16; --mute-bg:#223036;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.brand h1{margin:0;font-size:18px;font-weight:700;text-wrap:balance}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 14px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-block:20px 40px;display:flex;flex-direction:column;gap:20px}
h2{font-size:16px;margin:0;font-weight:600}
h3{font-size:14px;margin:0;font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:7px 12px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label.f > span{font-weight:500}
label.f.req > span::after{content:" *";color:var(--bad)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;border-left:4px solid var(--line)}
.kpi.bad{border-left-color:var(--bad)} .kpi.warn{border-left-color:var(--warn)} .kpi.ok{border-left-color:var(--ok)}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.2}
.kpi .l{font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--mute-bg);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);background:var(--surface-2);padding:8px 10px;white-space:nowrap;position:sticky;top:0}
table.t td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--accent-soft)}
td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select,.toolbar input{width:auto}
.banner{border-radius:8px;padding:10px 14px;font-size:13px;border:1px solid}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--fg);border-color:var(--line)}
.tanks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.tank{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tank .id{font-family:var(--mono);font-weight:600;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,18,22,.55);display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 24px) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal .box{background:var(--bg);border:1px solid var(--line);border-radius:10px;width:min(980px,100%);display:flex;flex-direction:column}
.modal .box.wide{width:min(1100px,100%)}
.box-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:10px 10px 0 0;flex-wrap:wrap}
.box-h h2{flex:1;min-width:0}
.box-b{padding:16px;display:flex;flex-direction:column;gap:16px}
.box-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 10px 10px;position:sticky;bottom:0}
fieldset{border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px;margin:0;background:var(--surface);min-width:0}
legend{font-weight:600;font-size:13px;padding:0 6px}
.status-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.res{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg)}
.res h4{grid-column:1/-1;margin:0;font-family:var(--mono);font-size:13px}
.att{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--bg)}
.att .nm{flex:1;min-width:140px;overflow-wrap:anywhere}
.att img{width:44px;height:44px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.guide p,.guide li{max-width:78ch}
.guide ol,.guide ul{padding-left:20px;margin:6px 0}
.guide .ref{font-family:var(--mono);font-size:12px;color:var(--accent)}
.ck{display:inline-flex;gap:3px}
.ck i{font-style:normal;min-width:22px;height:22px;padding:0 4px;border-radius:4px;display:inline-grid;place-items:center;font-size:12px;font-weight:600;background:var(--mute-bg);color:var(--muted)}
.ck i.ok{background:var(--ok-bg);color:var(--ok)} .ck i.warn{background:var(--warn-bg);color:var(--warn)} .ck i.bad{background:var(--bad-bg);color:var(--bad)}
.ckrow{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:4px 10px;align-items:start;font-size:13px}
.ckrow .chip{white-space:normal}
@media (max-width:560px){.ckrow{grid-template-columns:1fr}}

.preview-pages{display:flex;flex-direction:column;align-items:center;gap:14px;overflow-x:auto}
.pv{width:100%;max-width:794px}
.pv .scaler{transform-origin:top left}
@media (max-width:640px){.modal{padding:0}.modal .box{border-radius:0;min-height:100%}.box-h,.box-f{border-radius:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Report paper (fixed print colors, not themed: it is a white A4 sheet) ===== */
.rhost{position:fixed;left:-12000px;top:0;width:794px;z-index:-1}
.rpage{width:794px;height:1123px;background:#ffffff;color:#111a1f;font-family:var(--font);font-size:11px;line-height:1.45;padding:44px 48px 40px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.rpage .rh{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #0d5a6b;padding-bottom:10px}
.rpage .rh .co{font-weight:700;font-size:15px;color:#0d5a6b}
.rpage .rh .ad{color:#4d5c63;font-size:10px}
.rpage .rh .tt{text-align:right}
.rpage .rh .tt b{display:block;font-size:13.5px}
.rpage .rh .tt .mono{font-size:10px;color:#4d5c63}
.rpage h5{margin:0;font-size:11.5px;font-weight:700;color:#0d5a6b;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #c9d3d7;padding-bottom:3px}
.rpage table{border-collapse:collapse;width:100%}
.rpage td,.rpage th{border:1px solid #c9d3d7;padding:4px 6px;text-align:left;vertical-align:top}
.rpage th{background:#eef2f3;font-weight:600;color:#33434a;width:auto}
.rpage .kvt th{width:22%} .rpage .kvt3 th{width:12.5%} .rpage .kvt3 td{width:20.8%}
.rpage .num{font-family:var(--mono);text-align:right}
.rpage .pill{display:inline-block;padding:1px 6px;border-radius:3px;font-weight:600;font-size:10px}
.rpage .p-ok{background:#ddf1e5;color:#1d7349} .rpage .p-warn{background:#fbeccd;color:#8a5200} .rpage .p-bad{background:#fbe1dd;color:#a3231a} .rpage .p-mute{background:#eceff0;color:#56656b}
.rpage .cert{border:2px solid #1d7349;background:#f1faf4;padding:10px 12px;border-radius:4px}
.rpage .cert.no{border-color:#9a5b00;background:#fff8ea}
.rpage .cert b{font-size:12px}
.rpage .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:auto}
.rpage .sig div{border-top:1px solid #33434a;padding-top:4px;font-size:10px;color:#4d5c63;height:44px}
.rpage .rf{margin-top:auto;border-top:1px solid #c9d3d7;padding-top:6px;display:flex;justify-content:space-between;gap:12px;font-size:8.5px;color:#6b7a80}
.rpage .note{font-size:9.5px;color:#4d5c63}
.rpage .small td,.rpage .small th{font-size:9.5px;padding:3px 4px}
html{color-scheme:light} body{margin:0} img{max-width:100%} [hidden]{display:none!important}
</style>
</head>

/* ---------------- dates ---------------- */
function pd(s){ if(!s) return null; const d = new Date(s); return isNaN(d) ? null : d; }
const pad = n => String(n).padStart(2,"0");
function toInput(d){ return d ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}` : ""; }
function fdt(s){ const d = s instanceof Date ? s : pd(s); return d ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}` : ""; }
function fd(s){ const d = s instanceof Date ? s : pd(s); return d ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` : ""; }
const DAY = 86400000;

/* ---------------- status engine (ported from the Excel log) ---------------- */
const num = v => (v===""||v===null||v===undefined) ? null : (isFinite(+v) ? +v : NaN);
const ELS=["fe","cr","ni"], EL={fe:"Fe",cr:"Cr",ni:"Ni"};
function analyzedEl(r,el){ const ty=r[el+"Type"]; return !!pd(r.analysisAt) && (ty==="Measured"||ty==="<LOQ") && num(r[el+"Val"])!==null; }
function analyzed(r){ return analyzedEl(r,"fe"); }
function defCycles(){ const s=S.settings; if(s.defCycles) return JSON.parse(JSON.stringify(s.defCycles)); const b=s.defCycle||{mode:"shipment",n:1}; return {fe:{...b},cr:{...b},ni:{...b}}; }
function rawCycles(tank){ const D={mode:"default",n:1}; const c=(tank&&tank.cycles)||null; if(c) return {fe:c.fe||D, cr:c.cr||D, ni:c.ni||D}; const b=(tank&&tank.cycle)||D; return {fe:b, cr:b, ni:b}; }
function cyclesOf(tank){ const r=rawCycles(tank), d=defCycles(), o={}; ELS.forEach(el=>{ const v=r[el]; o[el] = (!v||v.mode==="default") ? (d[el]&&d[el].mode!=="default"?d[el]:{mode:"shipment",n:1}) : v; }); return o; }
const isSp = tank => !tank || tank.sp!==false;
const spWarn = tank => isSp(tank) && cyclesOf(tank).fe.mode!=="shipment";
function periodKey(d,mode){ if(mode==="monthly") return d.getFullYear()+"-"+pad(d.getMonth()+1); const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()); m.setDate(m.getDate()-((m.getDay()+6)%7)); return "W"+fd(m); }
function reqMapFor(asc, el, cy){
  const map=new Map(), n=Math.max(1,+cy.n||1);
  if(cy.mode==="weekly"||cy.mode==="monthly"){
    const groups=new Map();
    asc.forEach(r=>{ const L=pd(r.loadedAt); if(!L){ map.set(r,true); return; } const k=periodKey(L,cy.mode); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(r); });
    groups.forEach(g=>{ const any=g.some(r=>analyzedEl(r,el)); g.forEach((r,i)=>map.set(r, analyzedEl(r,el) || (!any && i===0))); });
    return map;
  }
  let counter=n-1, lastA=null;
  asc.forEach(r=>{
    let req=true; const L=pd(r.loadedAt), a=analyzedEl(r,el);
    if(cy.mode!=="shipment" && L && !a){ if(cy.mode==="every_n"){ counter++; req = counter>=n; } else if(cy.mode==="days"){ req = !lastA || (L-lastA)>=n*DAY; } }
    if(a){ counter=0; lastA=pd(r.analysisAt); }
    map.set(r,req);
  });
  return map;
}

function feScreen(r){
  const trig = +S.settings.feTrigger, v = num(r.feVal);
  if(!r.feType || r.feType==="Not tested" || v===null) return "Fe not reported";
  if(isNaN(v) || v<0) return "Check Fe entry";
  const qcOk = r.basis==="Yes" && r.qc==="Accepted";
  if(r.feType==="Measured"){ if(v>=trig) return "Fe >=50 - investigate"; return qcOk ? "Below Fe trigger" : "Verify basis / QC"; }
  if(r.feType==="<LOQ"){ if(v<=0) return "Check Fe limit"; if(v>trig) return "Limit too high - review"; return qcOk ? "Below Fe trigger (<LOQ)" : "Verify basis / QC"; }
  return "Check Fe type";
}
function deadline(r){ const u = pd(r.unloadedAt); return u ? new Date(u.getTime() + (+S.settings.deadlineDays)*DAY) : null; }
function t15(r, req){
  const u = pd(r.unloadedAt), a = pd(r.analysisAt), now = new Date();
  if(!u) return "Unload time needed";
  const dl = deadline(r);
  if(!a){ if(req===false) return "Not required by cycle"; return now > dl ? "Overdue - no analysis" : "Analysis pending"; }
  return a > dl ? "Late - over 15 days" : "Within 15-day limit";
}
function refillSt(r, req){
  const p = pd(r.refillAt), a = pd(r.analysisAt), u = pd(r.unloadedAt);
  if(!p) return "Refill time not recorded";
  if(!a) return req===false ? "Not required by cycle" : "Refilled without analysis";
  if(u && p < u) return "Check unload/refill order";
  return a < p ? "Before recorded refill" : "Not before refill";
}
function followUp(r, fe){
  if(fe==="Fe >=50 - investigate"){
    const a = pd(r.analysisAt), v = pd(r.visualAt), s = pd(r.sparkAt), rv = pd(r.reviewedAt);
    if(r.otherSrc==="Other sources excluded"){
      const ok = a && v && s && v>=a && s>=a && r.invReport && r.reviewer && rv && rv>=v && rv>=s && r.decision==="Reviewed - documented";
      return ok ? "Visual + spark records linked" : "Visual + spark records needed";
    }
    if(r.otherSrc==="External source identified"){
      const ok = r.invReport && r.reviewer && a && rv && rv>=a && r.decision==="Reviewed - documented";
      return ok ? "External-source review recorded" : "Record corrective action";
    }
    return "Investigate other sources";
  }
  if(fe==="Below Fe trigger"||fe==="Below Fe trigger (<LOQ)") return "No Fe-triggered action";

}

function scheduleEl(tank, el){
  const cy = cyclesOf(tank)[el], recs = S.records.filter(r=>r.tankId===tank.tankId);
  const asc = recs.filter(r=>pd(r.loadedAt)).sort((a,b)=>pd(a.loadedAt)-pd(b.loadedAt));
  const an = recs.filter(r=>analyzedEl(r,el)).sort((a,b)=>pd(b.analysisAt)-pd(a.analysisAt));
  const last = an[0] ? pd(an[0].analysisAt) : null;
  const key = el==="fe"?"req":el==="cr"?"reqCr":"reqNi";
  const pending = recs.filter(r=>!analyzedEl(r,el) && C(r)[key]!==false && pd(r.loadedAt));
  const now = new Date(); const n=Math.max(1,+cy.n||1);
  let text, toneV="ok", due=false;
  if(pending.length){
    const dls = pending.map(r=>{ const d=C(r).deadline, p=pd(r.refillAt); return [d,p].filter(Boolean).sort((a,b)=>a-b)[0]; }).filter(Boolean).sort((a,b)=>a-b);
    const first = dls[0]; due = true;
    if(first && first < now){ text = `${t("overdue")} · ${tf("pending",{n:pending.length})}`; toneV="bad"; }
    else { text = `${tf("pending",{n:pending.length})}${first ? " · "+tf("dueOn",{d:fd(first)}) : ""}`; toneV="warn"; }
  } else if(cy.mode==="shipment"){ text = t("dueNext"); }
  else if(cy.mode==="weekly"||cy.mode==="monthly"){
    const k = periodKey(now, cy.mode), w = cy.mode==="weekly";
    const done = asc.some(r=>analyzedEl(r,el) && periodKey(pd(r.loadedAt),cy.mode)===k);
    text = done ? t(w?"thisWeekDone":"thisMonthDone") : t(w?"firstShipWeek":"firstShipMonth");
  } else if(cy.mode==="every_n"){
    let k=0, seen=false; for(let i=asc.length-1;i>=0;i--){ if(analyzedEl(asc[i],el)){seen=true;break;} k++; }
    if(!seen) k += n-1;
    const rem = Math.max(0,n-k);
    text = rem<=1 ? t("dueNext") : tf("dueInShip",{n:rem-1});
  } else {
    const next = last ? new Date(last.getTime()+n*DAY) : null;
    if(!next){ text=t("dueNext"); }
    else if(next < now){ text = `${t("dueNext")} · ${fd(next)}~`; toneV="warn"; }
    else text = tf("dueOn",{d:fd(next)});
  }
  return {text, tone:toneV, due, last};
}

function spPanel(tanks){
  const sp=tanks.filter(isSp); if(!sp.length) return `<div class="empty">–</div>`;
  const cell=(recs,i)=>{ const ks=recs.map(r=>spChecks(r).list[i]); const ok=ks.filter(k=>k.st==="ok").length, bad=ks.filter(k=>k.st==="bad"||k.st==="warn").length, pend=ks.filter(k=>k.st==="pend").length;
    const tn=bad?"bad":pend?"warn":"ok"; const why=recs.filter((r,j)=>ks[j].st!=="ok").map((r,j)=>r.recordId).join(", ");
    return `<span class="chip ${recs.length?tn:""}" title="${esc(why)}">${ok}/${recs.length}${pend?` · ${S.lang==="ko"?"대기":"pending"} ${pend}`:""}${bad?` · ${S.lang==="ko"?"미흡":"fail"} ${bad}`:""}</span>`; };
  return `<div class="tbl-wrap"><table class="t"><thead><tr><th>Tank ID</th>${[0,1,2,3].map(i=>`<th>${esc(ckLabel(i))}</th>`).join("")}</tr></thead><tbody>

}

  <p class="ref">49 CFR §§ 180.352(b)(3), 180.605(c)(1) · 107.107 (party status)</p>
  </section>`;

function u8FromDataURL(d){ const b=atob(d.split(",")[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
const ascii = s => String(s).normalize("NFKD").replace(/[^\x20-\x7E]/g,"").replace(/\s+/g," ").trim();
async function imgToPng(blob){
  const url=URL.createObjectURL(blob);
  try{ const im=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;});
    const c=document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext("2d").drawImage(im,0,0);
    return u8FromDataURL(c.toDataURL("image/png")); } finally{ URL.revokeObjectURL(url); }
}
async function buildPdf(printWin){
  const btn=document.getElementById("dlBtn"); const b=buildRep(); if(!b||!downloads) return;
  btn.disabled=true; btn.textContent=t("building");
  const host=document.createElement("div"); host.className="rhost"; host.innerHTML=b.pages.join(""); document.body.appendChild(host);
  const failed=[];
  try{
    try{ await document.fonts.ready; }catch(e){}
    const {PDFDocument, StandardFonts, rgb} = PDFLib;
    const out = await PDFDocument.create();
    out.setTitle(rep.kind==="rec"?"DOT-SP 11827 Contamination Record":"DOT-SP 11827 Tank History"); out.setAuthor(S.settings.company); out.setProducer("JNFAM Tank ICP-MS Log"); out.setSubject(COPY);
    const W=595.28, H=841.89;
    for(const el of host.querySelectorAll(".rpage")){
      const cv = await html2canvas(el,{scale:2,backgroundColor:"#ffffff",logging:false,useCORS:true});
      const jpg = await out.embedJpg(u8FromDataURL(cv.toDataURL("image/jpeg",0.92)));
      out.addPage([W,H]).drawImage(jpg,{x:0,y:0,width:W,height:H});
    }
    const font = await out.embedFont(StandardFonts.Helvetica);
    for(const a of b.attachments){
      try{
        const blob = await getFileBlob(a.id); const type = a.type || blob.type; const cap = ascii(`Evidence ${a.label} - Record ${a.rec} - ${a.name}`) || `Evidence ${a.label}`;
        if(/pdf/.test(type)){
          const src = await PDFDocument.load(await blob.arrayBuffer(),{ignoreEncryption:true});
          const pages = await out.copyPages(src, src.getPageIndices());
          pages.forEach(p=>{ out.addPage(p); const {width}=p.getSize(); p.drawRectangle({x:0,y:0,width,height:14,color:rgb(1,1,1),opacity:0.85}); p.drawText(cap.slice(0,140),{x:8,y:4,size:7,font,color:rgb(0.2,0.25,0.3)}); });
        } else {
          const bytes = /png/.test(type) ? new Uint8Array(await blob.arrayBuffer()) : /jpe?g/.test(type) ? null : await imgToPng(blob);
          const img = /jpe?g/.test(type) ? await out.embedJpg(new Uint8Array(await blob.arrayBuffer())) : await out.embedPng(bytes);
          const p = out.addPage([W,H]); const m=36, top=28;
          p.drawText(cap.slice(0,120),{x:m,y:H-m,size:9,font,color:rgb(0.05,0.35,0.42)});
          const sc = Math.min((W-2*m)/img.width,(H-2*m-top)/img.height,1.5);
          p.drawImage(img,{x:(W-img.width*sc)/2,y:H-m-top-img.height*sc,width:img.width*sc,height:img.height*sc});
        }
      }catch(e){ failed.push(a.name); }
    }
    const bytes = await out.save();
    const r = rep.kind==="rec" ? S.records.find(x=>x.id===rep.id) : null; const tk = rep.kind==="tank" ? S.tanks.find(x=>x.id===rep.id) : null;
    const fname = (rep.kind==="rec" ? `SP11827_Record_${r.recordId}_${r.tankId}` : `SP11827_Tank_${tk.tankId}_${rep.scope}`) + `_${fd(new Date())}.pdf`;
    const pdfBlob = new Blob([bytes],{type:"application/pdf"});
    if(printWin){ printWin.location.href = URL.createObjectURL(pdfBlob); }
    else await downloads.save({filename: fname.replace(/[^\w.\-]+/g,"_"), data: pdfBlob});
    toast(failed.length ? t("evFail")+failed.join(", ") : t("pdfOk"));
  }catch(e){
    if(printWin) printWin.close();
    if(e && e.code==="declined"){} else toast(t("pdfFail")+(e.code||"")+" "+(e.message||e));
  }finally{ host.remove(); btn.disabled=false; btn.textContent=t("dlPdf"); }
}

function cellStr(v){ if(v instanceof Date) return toInput(v); if(v===null||v===undefined) return ""; return String(v).trim(); }
async function importXlsx(file){
  try{
    const wb = XLSX.read(await file.arrayBuffer(),{cellDates:true});
    const findHdr = (ws,first) => { const a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}); const i=a.findIndex(r=>r&&String(r[0]||"").trim()===first); return i<0?null:{hdr:a[i].map(h=>String(h||"").replace(/\s+/g," ").trim()),rows:a.slice(i+1)}; };
    let nt=0,nr=0,skip=0;
    const tw = wb.Sheets["Tank Register"]; const th = tw && findHdr(tw,"Tank ID");
    if(th){ for(const row of th.rows){ const id=cellStr(row[0]); if(!id) continue; if(S.tanks.some(x=>x.tankId===id)){skip++;continue;}
      const g=n=>cellStr(row[th.hdr.findIndex(h=>h.startsWith(n))]);
      await putDoc("tanks",uid("t_"),{tankId:id,product:g("Dedicated product"),lining:g("Lining"),dedicated:g("Dedicated service")||"Not confirmed",identified:g("Tank identified")||"Not confirmed",party:g("Party-status")||"Not confirmed",authRef:g("Authorization"),validUntil:g("Valid until").slice(0,10),procRef:g("Procedure"),active:true,sp:true,cycles:{fe:{mode:"default",n:1},cr:{mode:"default",n:1},ni:{mode:"default",n:1}}}); nt++; } }
    const sw = wb.Sheets["Shipment Log"]; const sh = sw && findHdr(sw,"Record ID");
    if(!sh) throw new Error("no sheet");
    const norm = h => h.replace(/\s+/g," ").trim();
    const idx = XH.map(h=>sh.hdr.findIndex(x=>norm(x)===norm(h)));
    for(const row of sh.rows){
      const rid = cellStr(row[idx[0]]); if(!rid) continue;
      if(S.records.some(x=>x.recordId===rid)){ skip++; continue; }
      const d={attachments:[]};
      XK.forEach((k,i)=>{ if(!k||idx[i]<0) return; let v=row[idx[i]]; d[k] = DTK.has(k) ? (v instanceof Date ? toInput(v) : cellStr(v)) : cellStr(v); });
      await putDoc("records",uid("r_"),d); nr++;
    }
    toast(tf("imported",{t:nt,r:nr,s:skip}));
  }catch(e){ toast(t("importFail")); }
}

    case "delTank": {
      if(delArm!==el){ delArm=el; el.textContent=t("confirmDel"); setTimeout(()=>{ if(delArm===el){ delArm=null; el.textContent=t("del"); } },4000); return; }
      delArm=null; try{ await delDoc("tanks",tDraft.id); toast(t("deleted")); closeModal(); }catch(e){ toast(e.message||e); } break; }
    case "dlPdf": buildPdf(null); break;
    case "export": exportXlsx(); break;
    case "import": document.getElementById("importFile").click(); break;
  }
});
document.addEventListener("change", async ev=>{
  const el=ev.target;
  if(el.id==="ftank"){ S.filter.tank=el.value; render(); }
  else if(el.id==="importFile" && el.files[0]){ await importXlsx(el.files[0]); el.value=""; }
  else if(el.dataset.attKind!==undefined){ draft.attachments[+el.dataset.attKind].kind=el.value; if(!draftNew){ readForm(); await persistRecord(true);} liveStatus(); }
  else if(el.id==="rpLang"){ rLang=el.value; renderReport(); }
  else if(el.id==="rpScope"){ rep.scope=el.value; renderReport(); }
  else if(el.id==="rpEv"){ rep.incEv=el.checked; renderReport(); }
  else if(el.dataset && el.dataset.cyc){ const n=document.getElementById(el.dataset.cyc); if(n) n.hidden=!needN(el.value); }
  if(el.id==="k_sp"||el.id==="k_cyc_fe"){ const w=document.getElementById("cycWarnBox"); if(w){ let m=document.getElementById("k_cyc_fe").value; if(m==="default") m=cyclesOf(null).fe.mode; w.hidden = !(document.getElementById("k_sp").value==="Yes" && m!=="shipment"); } }
  if(el.closest && el.closest("#recForm")) liveStatus();
});
document.addEventListener("input", ev=>{
  const el=ev.target;
  if(el.id==="fq"){ S.filter.q=el.value; S._fq=true; render(); }
  else if(el.closest && el.closest("#recForm") && el.tagName!=="TEXTAREA") liveStatus();
});
document.addEventListener("submit", async ev=>{
  ev.preventDefault();
  if(ev.target.id==="recForm") saveRecord();
  else if(ev.target.id==="tankForm") saveTank();
  else if(ev.target.id==="setForm"){
    const g=k=>document.getElementById("s_"+k).value;
    const d={feTrigger:+g("feTrigger")||50, deadlineDays:parseInt(g("deadlineDays"))||15, recentN:parseInt(g("recentN"))||5, tz:g("tz"), company:g("company"), address:g("address"), preparer:g("preparer"), defCycles:readCycles("s")};
    try{ await putDoc("config","settings",d); if(S.mode==="shared"){ S.settings={...S.settings,...d}; recompute(); render(); } toast(t("saved")); }catch(e){ toast(e.message||e); }
  }
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && document.getElementById("modalRoot").innerHTML) closeModal(true); });
document.getElementById("langKo").onclick=()=>{S.lang="ko"; lsSet("sp_lang","ko"); render();};
document.getElementById("langEn").onclick=()=>{S.lang="en"; lsSet("sp_lang","en"); render();};

let toastT=null;
function toast(msg){ const r=document.getElementById("toastRoot"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>{r.innerHTML=""},4200); }


init();
})();
</script>
</body>
</html>
